services:
  backend:
    build: ./backend
    container_name: plan-accion-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_ON_START: ${SEED_ON_START}
      JWT_SECRET: supersecreto
      JWT_EXPIRE_HOURS: "8"
      CORS_ORIGINS: ${{CORS_ORIGINS}}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: plan-accion-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    environment:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    driver: local