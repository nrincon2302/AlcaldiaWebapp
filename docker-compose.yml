services:
  backend:
    build: ./backend
    container_name: plan-accion-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_ON_START: ${SEED_ON_START}
      JWT_SECRET: supersecreto
      JWT_EXPIRE_HOURS: "8"
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SHINY_URL: ${VITE_SHINY_URL}
        SERVER_IP: ${SERVER_IP}
        # Se ingresan como variables de entorno los enlaces de Enketo
        VITE_CAPTURA_BASE: ${VITE_CAPTURA_BASE}
        VITE_DDC_SATEXP_PR: ${VITE_DDC_SATEXP_PR}
        VITE_DDC_SATEXP_CT: ${VITE_DDC_SATEXP_CT}
        VITE_DDC_SATEXP_CV: ${VITE_DDC_SATEXP_CV}
        VITE_DDC_PQRSD: ${VITE_DDC_PQRSD}
        VITE_DDC_CALPROC: ${VITE_DDC_CALPROC}
        VITE_DDC_COPR_CAPINS: ${VITE_DDC_COPR_CAPINS}
        VITE_DDC_COPR_STDYPRTC: ${VITE_DDC_COPR_STDYPRTC}
        VITE_DDC_COVRT: ${VITE_DDC_COVRT}
        VITE_DDC_COTEL: ${VITE_DDC_COTEL}
    container_name: plan-accion-frontend
    environment:
      SERVER_IP: ${SERVER_IP}
      SHINY_HOST: ${SHINY_HOST}
      BACKEND_HOST: ${BACKEND_HOST}
    # MEDIUM: Self-signed cert — el cert se genera manualmente con mkcert
    # Instrucciones:
    #   mkcert <SERVER_IP>
    #   mkdir ssl
    #   mv <SERVER_IP>.pem ssl/cert.pem
    #   mv <SERVER_IP>-key.pem ssl/key.pem
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge